name: Deploy to GitHub Pages

# SIN BUILD: el sitio es el código fuente (HTML/CSS/JS puros + ./vendor).
# Este workflow solo inyecta los secrets de Supabase en config.js y arma
# la carpeta site/ que se publica en Pages.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si faltan los secrets, quedarían los placeholders y publicaríamos
      # un sitio que no conecta con Supabase. Fallar acá es mejor que
      # romper en vivo.
      - name: Verificar secrets
        run: |
          fail=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secret $v — crearlo en Settings → Secrets and variables → Actions"
              fail=1
            fi
          done
          exit $fail
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # config.js es un script clásico que index.html carga antes del módulo
      # ES y que define globalThis.__APP_CONFIG__ (ver supabase-config.js).
      - name: Generar config.js desde secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > config.js <<EOF
          // Generado por .github/workflows/deploy.yml — no editar a mano en CI.
          globalThis.__APP_CONFIG__ = {
            supabaseUrl: '${VITE_SUPABASE_URL}',
            supabaseAnonKey: '${VITE_SUPABASE_ANON_KEY}',
          };
          EOF

      - name: Armar sitio estático
        run: |
          rm -rf site
          mkdir site
          cp index.html style.css sw.js site/
          cp *.js site/                # módulos ES de la app + config.js
          cp -r vendor site/vendor      # supabase.js + onnxruntime (sin el wasm)
          cp -r public/. site/          # modelos ONNX, iconos, manifest, etc.

          # Smoke checks: nada de placeholders ni archivos faltantes
          if grep -q 'TU_PROYECTO' site/config.js; then
            echo "::error::config.js quedó con placeholders: los secrets no se inyectaron"
            exit 1
          fi
          for f in site/index.html site/main.js site/sw.js site/style.css \
                   site/vendor/supabase.js site/vendor/ort.all.bundle.min.mjs \
                   site/models/yolov8_plate.onnx site/models/ppocr_rec.onnx \
                   site/manifest.json; do
            if [ ! -f "$f" ]; then echo "::error::Falta $f en el sitio"; exit 1; fi
          done

      # Sin build no hay hashes por archivo: el Service Worker se versiona
      # con un hash de todo el sitio. Cualquier cambio publicado altera los
      # bytes de sw.js → el navegador instala el SW nuevo → precachea en un
      # caché con nombre distinto y borra el anterior (sin versiones mezcladas).
      - name: Versionar el Service Worker (hash del sitio)
        run: |
          HASH=$(find site -type f -print0 | sort -z | xargs -0 md5sum | md5sum | cut -c1-12)
          sed -i "s/^const VERSION = .*$/const VERSION = 'v-${HASH}';/" site/sw.js
          if ! grep -q "const VERSION = 'v-${HASH}'" site/sw.js; then
            echo "::error::No se pudo inyectar VERSION en site/sw.js"
            exit 1
          fi
          echo "Service Worker version: v-${HASH}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
